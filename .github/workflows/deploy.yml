name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # checkout v4, setup-node v4, upload-pages-artifact v3, and deploy-pages v4
      # target Node.js 20. GitHub removed that runtime (changelog 2026-09-23).
      # On 2026-11-09 the Pages run failed before any job started ("workflow file
      # issue"), while the Node 24 content-factory workflow on the same commit
      # started normally. These majors run on Node 24.
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: ${{ vars.VITE_BASE || '/' }}
          VITE_LEADS_WEBHOOK_URL: ${{ secrets.VITE_LEADS_WEBHOOK_URL }}
          VITE_PROJECT_NAME: cryptobus
      - name: SPA 404 fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
